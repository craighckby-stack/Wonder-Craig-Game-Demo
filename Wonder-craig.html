<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Wonder Craig 2026</title>
<style>
:root{--bg:#0b0b14;--edge:#2c2c48;--dim:#8a8aa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0b14}}
:root[data-theme=dark]{--bg:#0b0b14}
*{margin:0;padding:0;box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%}

body{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;user-select:none}
#game{width:100%;max-width:760px;border:2px solid var(--edge);border-radius:16px;overflow:hidden;box-shadow:0 12px 40px #000c,0 0 60px #6a3cff22}
#bar{display:flex;gap:6px;justify-content:flex-end;padding:6px 8px;background:#0a0a12}
#bar button{background:#1a1a2e;color:#c4c4dc;border:1px solid var(--edge);border-radius:8px;padding:4px 10px;font:12px system-ui;cursor:pointer}
#bar button.off{opacity:.5}

canvas{display:block;width:100%;height:auto;background:#000}
#pad{display:none;height:120px;background:#0a0a12;padding:0 14px;justify-content:space-between;align-items:center}
#pad.show{display:flex}
.g{display:flex;gap:10px}
.btn{width:62px;height:62px;background:#ffffff14;border:2px solid #ffffff40;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fffd;font-size:22px}
.btn.on{background:#ffffff4d;transform:scale(.92)}
#hint{color:var(--dim);font-size:12px;padding:8px 10px;text-align:center;line-height:22px;max-width:760px}
</style>
</head>
<body>
<div id="game">
 <div id="bar"><button id="bM">Music: on</button><button id="bP">Pause</button></div>
 <canvas id="c" width="960" height="540"></canvas>
 <div id="pad"><div class="g"><div class="btn" id="bl">◀</div><div class="btn" id="br">▶</div></div><div class="g"><div class="btn" id="bu">🦄</div><div class="btn" id="ba">⚡</div><div class="btn" id="bj">▲</div></div></div>
</div>
<div id="hint">◀ ▶ / A D move · SPACE jump (hold = higher, tap again = double jump) · Z X throw axe · C / SHIFT unicorn rush · ENTER next · ESC skip · P pause · M music</div>

<script>

let AC=null,musicOn=true,mT=0,iT=0;
function getAC(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,ty,d,v,fe){try{const a=getAC();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.connect(g);g.connect(a.destination);o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(fe)o.frequency.exponentialRampToValueAtTime(fe,t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const seq=(ns,ty,d,v,gap)=>ns.forEach((n,i)=>setTimeout(()=>tone(n,ty,d,v),i*gap));
const sfx={jump:()=>tone(240,'square',.12,.08,480),dj:()=>tone(420,'triangle',.14,.09,900),land:()=>tone(120,'triangle',.06,.08,70),
 coin:()=>{tone(880,'sine',.08,.08);setTimeout(()=>tone(1320,'sine',.1,.08),70)},axe:()=>tone(320,'sawtooth',.06,.08,140),clang:()=>tone(500,'square',.05,.06,300),
 hit:()=>{tone(180,'sawtooth',.2,.18,50);setTimeout(()=>tone(90,'square',.3,.15,30),120)},enemy:()=>{tone(350,'square',.08,.1,150);setTimeout(()=>tone(180,'square',.1,.1,80),60)},
 power:()=>seq([440,554,659,880],'triangle',.1,.1,70),fire:()=>tone(260,'sawtooth',.25,.1,90),roar:()=>tone(100,'sawtooth',.4,.2,40),
 win:()=>seq([523,659,784,1047,1318],'square',.2,.12,120),start:()=>seq([220,277,330,440],'square',.15,.1,80),
 uni:()=>seq([660,880,1100,1320],'sine',.12,.07,45),rush:()=>tone(200,'sawtooth',.5,.1,900)};
const MEL=[392,440,494,523,494,440,392,330,392,440,494,523,587,523,494,440],BAS=[196,196,196,196,196,196,196,165,196,196,196,196,293,293,247,220],KEY=[1,.89,.8,.94,.75],TEMPO=[150,135,140,125,115];
function startMusic(){if(mT||!musicOn||state!=='play'||paused)return;let i=0;(function t(){const k=KEY[level-1];tone(MEL[i%16]*k,'square',.12,.025);tone(BAS[i%16]*k,'triangle',.12,.02);i++;mT=setTimeout(t,TEMPO[level-1])})()}
function stopMusic(){clearTimeout(mT);mT=0}
const LULL=[262,330,392,523,392,330,262,330];
function startIntroMusic(){if(iT||!musicOn||state!=='intro')return;let i=0;(function t(){tone(LULL[i%8],'triangle',.5,.02);tone(LULL[i%8]/2,'sine',.6,.015);i++;iT=setTimeout(t,400)})()}
function stopIntroMusic(){clearTimeout(iT);iT=0}
function sync(){$('bM').textContent='Music: '+(musicOn?'on':'off');$('bM').classList.toggle('off',!musicOn);$('bP').textContent=paused?'Resume':'Pause'}
function togMusic(){musicOn=!musicOn;if(musicOn){state==='intro'?startIntroMusic():startMusic()}else{stopMusic();stopIntroMusic()}sync()}
function togPause(){if(state!=='play')return;paused=!paused;paused?stopMusic():startMusic();sync()}
$('bM').onclick=e=>{togMusic();e.target.blur()};$('bP').onclick=e=>{togPause();e.target.blur()};

const K={},touch={};
const MAP={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j',KeyZ:'a',KeyX:'a',KeyC:'u',KeyV:'u',ShiftLeft:'u',ShiftRight:'u'};
addEventListener('keydown',e=>{getAC();const m=MAP[e.code];if(m){K[m]=1;e.preventDefault()}
 if(e.repeat)return;

 if(e.code==='Escape'&&state==='intro'){begin();return}
 if(e.code==='KeyP'||e.code==='Escape')togPause();
 if(e.code==='KeyM')togMusic()});
addEventListener('keyup',e=>{const m=MAP[e.code];if(m)K[m]=0});

[['bl','l'],['br','r'],['bj','j'],['ba','a'],['bu','u']].forEach(([id,k])=>{const el=$(id),on=e=>{e.preventDefault();getAC();touch[k]=1;el.classList.add('on')},off=()=>{touch[k]=0;el.classList.remove('on')};
 el.addEventListener('touchstart',on,{passive:false});el.addEventListener('mousedown',on);['touchend','touchcancel','mouseup','mouseleave'].forEach(n=>el.addEventListener(n,off))});
cv.addEventListener('pointerdown',e=>{getAC();
 if(state==='title'){startIntro();return}
 if(state==='intro'){const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,py=(e.clientY-r.top)*H/r.height;
  if(px>W-130&&py<30)begin();else advanceIntro();return}
 begin()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play'&&!paused)togPause();stopIntroMusic()}else if(state==='intro')startIntroMusic()});
addEventListener('blur',()=>{if(state==='play'&&!paused)togPause()});

const LV=[
{n:'Green Valley',ww:3200,gaps:[],sp:1,fc:'#E83000',sky:['#1870E8','#8CCBFF'],mt:'#2B7A3B',top:'#40A838',dirt:'#A05820',en:[450,770,1050,1300,1550,1800,2100,2400,2750,3050],
 pl:[[300,56,80],[500,90,64,700,1.2],[750,60,96],[980,100,80],[1200,64,64],[1400,80,96],[1650,56,80],[1900,96,80,2150,1.5],[2300,72,96],[2600,80,64],[2900,60,120]],pu:[[3,'heart'],[5,'shield'],[8,'axe']]},
{n:'Volcanic Caves',ww:3600,gaps:[[880,950],[1700,1780],[2500,2570]],sp:1.2,fc:'#50C848',sky:['#301040','#803060'],mt:'#4A1A28',top:'#B83020',dirt:'#781810',lv:'#FF5A14',en:[350,600,1150,1450,2050,2350,2700,3050,3400],
 pl:[[250,60,64],[450,100,80],[700,70,64,950,1.8],[1050,110,96],[1350,60,80],[1600,90,64],[1850,120,80],[2150,70,96,2450,2],[2600,100,80],[2900,80,64],[3200,60,150]],pu:[[3,'heart'],[6,'axe'],[9,'horn']]},
{n:'Frostbite Tundra',ww:3400,gaps:[[800,880],[1600,1690],[2400,2480]],sp:1.3,fc:'#FF5C8A',sky:['#0A2A5A','#9AD8F0'],mt:'#6A90B8',top:'#DCEBFF',dirt:'#7A98C0',lv:'#1A3A7A',ice:1,en:[400,650,1100,1400,1900,2200,2650,3000,3250],
 pl:[[300,56,80],[520,92,64],[720,64,64,920,1.6],[1050,100,80],[1250,70,96],[1480,100,64],[1650,80,64,1850,1.8],[2000,110,80],[2250,70,80],[2550,100,64],[2800,70,96],[3100,90,80]],pu:[[3,'heart'],[5,'wings'],[8,'axe'],[10,'shield']]},
{n:'Kidney Black Market',ww:3600,gaps:[[700,770],[1300,1390],[1900,1980],[2600,2680]],sp:1.5,fc:'#FFD23F',sky:['#2A0A3A','#C0306A'],mt:'#4A1038',top:'#E070B0',dirt:'#80285A',lv:'#58C020',en:[350,520,900,1100,1500,1700,2100,2300,2800,3000,3300],
 pl:[[250,60,64],[430,100,80],[600,70,64],[800,100,96],[1000,70,64,1200,2],[1450,100,80],[1650,64,64],[1850,110,64],[2050,80,80,2350,2.2],[2500,100,64],[2750,64,80],[2950,110,64],[3150,80,96],[3400,60,120]],pu:[[1,'heart'],[5,'horn'],[9,'shield'],[12,'heart']]},
{n:'The Dark Keep',ww:2600,gaps:[[700,770],[1400,1470]],sp:1.4,fc:'#E060C0',sky:['#080815','#202048'],mt:'#1A1A30',top:'#607090',dirt:'#303850',lv:'#2A1A5A',en:[400,1000,1700,2000],
 pl:[[250,64,80],[500,90,80],[750,120,96],[1050,80,64],[1300,100,80],[1600,70,96],[1900,90,100],[2200,60,300]],pu:[[2,'heart'],[4,'shield'],[6,'horn']]}];

let state='title',paused=false,score=0,sc0=0,level=1,fc=0,shake=0,hs=0,msg='',msgT=0,banner=0,camX=0,WW=3200,hi=0,cmb=0,cmbT=0,ck={x:40,y:GY-28},pinkCd=60;
let introIdx=0,introChars=0,introF=0,introPhase='dialog';
try{hi=+localStorage.getItem('wc26_hi')||0}catch(e){}
const saveHi=()=>{if(score>hi){hi=score;try{localStorage.setItem('wc26_hi',hi)}catch(e){}}};
const P={x:40,y:GY-28,w:16,h:28,vx:0,vy:0,og:false,f:1,wf:0,wt:0,inv:0,sc:0,power:1,cy:0,jb:0,pj:0,on:null,hp:3,dj:1,dm:1,rush:0,rcd:0,rh:0,sq:0,frenzy:0,shield:0};
let plats=[],fruits=[],enemies=[],axes=[],pus=[],parts=[],pops=[],fb=[],stars=[],trail=[],boss=null;

const ol=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const burst=(x,y,c,n=8)=>{for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5-1,c,life:30,s:Math.random()*3+2})};
const pop=(x,y,t)=>pops.push({x,y,t,life:50});

function loadLevel(n){
 level=n;sc0=score;const L=LV[n-1];WW=L.ww;axes=[];parts=[];pops=[];fb=[];stars=[];boss=null;plats=[];let s=0;
 [...L.gaps,[WW,WW]].forEach(([a,b])=>{if(a>s)plats.push({x:s,y:GY,w:a-s,h:48});s=b});
 L.pl.forEach(([x,u,w,x2,sp])=>plats.push({x,y:GY-u,w,h:12,mv:!!x2,x1:x,x2,sp,dir:1}));
 const gap=x=>L.gaps.some(([a,b])=>x>a-14&&x<b+4),near=x=>L.gaps.some(([a,b])=>x>a-200&&x<b+140);
 fruits=L.pl.filter(p=>!p[3]).map(([x,u,w])=>({x:x+w/2-5,y:GY-u-18,w:10,h:10,got:0}));
 for(let x=220;x<WW-200;x+=280)if(!gap(x))fruits.push({x,y:GY-24,w:10,h:10,got:0});
 enemies=L.en.map((x,i)=>{const ty=n>1&&i%3===2?'f':((n===1?i%4===3:i%3===1)&&!near(x))?'h':'w';
  return{x,y:ty==='f'?GY-84:GY-20,y0:GY-20,x0:x,w:20,h:20,vx:(i%2?1:-1)*L.sp,vy:0,alive:1,st:0,sh:'',ty,t:i*20}});
 pus=L.pu.map(([i,t])=>{const p=L.pl[i];return{x:p[0]+p[2]/2-8,y:GY-p[1]-26,w:16,h:16,type:t,taken:0}});
 if(n===LV.length)boss={x:2350,y:GY-48,w:48,h:48,hp:12,max:12,vx:-.8,vy:0,alive:1,t:0,hit:0,ih:0};
 ck={x:40,y:GY-P.h};resetP();banner=150;pinkCd=60;cmb=0;
 if(n===LV.length)sfx.roar();
}

 P.hp=3;state='play';paused=false;msgT=0;loadLevel(level);startMusic();sfx.start();sync()}

 if(introIdx===2){pop(104,132,'!');tone(150,'sawtooth',.16,.07,80)}}
function startIntro(){if(state==='intro')return;getAC();state='intro';introPhase='dialog';introIdx=0;introF=0;camX=0;parts=[];pops=[];
 seq([392,494,587,784],'triangle',.12,.06,90);showLine();startIntroMusic();sync()}
function advanceIntro(){
 if(introPhase==='mission'){begin();return}

function resolveP(o){
 const prev=o.og,vy0=o.vy;o.og=false;o.on=null;
 for(const p of plats){if(!ol(o,p))continue;
  const ob=o.y+o.h-p.y,ot=p.y+p.h-o.y,or=o.x+o.w-p.x,oL=p.x+p.w-o.x;
  if(Math.min(ob,ot)<Math.min(or,oL)){
   if(ob<ot){o.y=p.y-o.h;if(o.vy>0)o.vy=0;o.og=true;o.on=p;if(p.mv)o.x+=p.sp*p.dir}
   else{o.y=p.y+p.h;if(o.vy<0)o.vy=0}
  }else if(or<oL){o.x=p.x-o.w;o.vx=0}else{o.x=p.x+p.w;o.vx=0}}
 if(!prev&&o.og&&vy0>3){sfx.land();o.sq=-.28;burst(o.x+o.w/2,o.y+o.h,'#999',4)}}

function hurt(e,pit){
 if(state!=='play')return;

 if(e){e.sh=pick(SHOUTS);e.st=90}

 if(introPhase==='dialog'){const L=INTRO[introIdx],len=L[1].length;
  if(introChars<len&&fc%3===0){introChars=Math.min(len,introChars+2);if(introChars%4===0)tone(({pink:760,blue:560,craig:290})[L[0]]+((introChars*37)%110),'square',.026,.03)}}
 parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--});parts=parts.filter(p=>p.life>0);
 pops.forEach(p=>{p.y-=.6;p.life--});pops=pops.filter(p=>p.life>0)}
function update(){
 fc++;if(shake>0)shake--;
 if(state==='title'){camX=(fc*.6)%(WW-W);return}
 if(state==='intro'){updateIntro();return}
 if(state!=='play'||paused)return;
 if(hs>0){hs--;return}
 if(banner>0)banner--;if(msgT>0)msgT--;if(cmbT>0&&--cmbT===0)cmb=0;

 stars.forEach(s=>{const x=sx(s.x);ctx.fillStyle='rgba(255,154,224,.35)';ctx.beginPath();ctx.arc(x,s.y,8,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.save();ctx.translate(x,s.y);ctx.rotate(fc/5);ctx.fillRect(-5,-1.5,10,3);ctx.fillRect(-1.5,-5,3,10);ctx.restore()});
 axes.forEach(a=>{ctx.save();ctx.translate(sx(a.x)+5,a.y+5);ctx.rotate(a.s);ctx.fillStyle='#E0E0E0';ctx.fillRect(-6,-2,12,4);ctx.fillStyle='#D87840';ctx.fillRect(-2,-6,4,12);ctx.restore()});
 if(state!=='title'){[[24,'#FF8AD0','#C04098'],[48,'#6AB0FF','#2F5FC0']].forEach(([d,b,m],i)=>{if(i&&P.rush>0)return;const t=trail[Math.min(d,trail.length-1)];if(t)drawUni(sx(t.x)+8,t.y-6+Math.sin(fc/14+i*2)*3,b,m,t.f,false,.62)})}

 if(P.shield&&state!=='title'){ctx.strokeStyle='#7AA0FFcc';ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx(P.x)+8,P.y+14,20,0,7);ctx.stroke()}

 if(state==='play'||state==='dead'||state==='win'){
  const hp=Math.max(0,P.hp),rd=P.rush>0?1:1-P.rcd/300;

 if(banner>0&&state==='play'){ctx.globalAlpha=Math.min(1,banner/30);ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,90,W,60);T(`STAGE ${level}`,W/2,118,'#F8B800',24,'center');T(L.n,W/2,142,'#fff',15,'center');ctx.globalAlpha=1}
 if(msgT>0&&state==='play'){ctx.fillStyle='rgba(0,0,0,.75)';ctx.beginPath();ctx.roundRect(W/2-150,H/2-12,300,30,10);ctx.fill();T(msg,W/2,H/2+8,'#fff',13,'center')}

 if(state==='title'){shade();
  T('WONDER CRAIG',W/2,H/2-52,'#F8B800',38,'center');T('2026 DELUXE EDITION',W/2,H/2-26,'#7CFF6A',16,'center');

  const tg=TAGS[(fc/90|0)%TAGS.length];T(tg[0],W/2,H/2+32,tg[1],13,'center');

 if(paused){shade();T('PAUSED',W/2,H/2,'#F8B800',30,'center');T('P / ESC TO RESUME',W/2,H/2+26,'#fff',14,'center')}
 if(state==='dead'){shade();T('GAME OVER',W/2,H/2-34,'#E83000',30,'center');T(msg,W/2,H/2-12,'#aab',12,'center');T('SCORE '+score+(score>=hi&&score?'  NEW BEST!':''),W/2,H/2+10,'#F8B800',15,'center');T('PRESS ENTER OR TAP TO RETRY STAGE '+level,W/2,H/2+36,'#fff',14,'center')}
 if(state==='win'){shade();T('VICTORY!',W/2,H/2-34,'#7CFF6A',30,'center');T('FINAL SCORE '+score,W/2,H/2-6,'#F8B800',16,'center');T(`(includes ${Math.max(0,P.hp)*1000} heart bonus)`,W/2,H/2+12,'#aab',12,'center');T('PRESS ENTER OR TAP TO PLAY AGAIN',W/2,H/2+36,'#fff',14,'center');T('P.S. The unicorns took one kidney as a "fee".',W/2,H/2+54,'#8a8aa0',12,'center')}
 ctx.restore()}

let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=16.667){update();acc-=16.667}draw();requestAnimationFrame(loop)}
